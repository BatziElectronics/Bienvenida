<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video dedicado</title>
</head>
<body>
  <h1>Hey, me alegra que estés aquí ❤️</h1>
  <p>Por ello te quiero dedicar esta canción.</p>

  <!-- 🔹 BOTÓN PARA IR AL VIDEO -->
  <a class="boton" href="https://m.youtube.com/watch?v=pbm1Nzi23fM&t=630s&pp=2AH2BJACAdIHCQkbAaO1ajebQw%3D%3D" target="_blank">Ver video en YouTube 🎵</a>

  <!-- Aquí se insertará el video embebido -->
  <div id="player"></div>

  <!-- API de YouTube -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    // ID del video de YouTube (solo el ID, no toda la URL)
    const VIDEO_ID = "pbm1Nzi23fM&t=630s&pp=2AH2BJACAdIHCQkbAaO1ajebQw%3D%3D"; 
    // URL a donde redirigir cuando termina
    const NEXT_PAGE = "https://batzielectronics.github.io/Entrenamiento-Inteligente/";

    let player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        videoId: VIDEO_ID,
        playerVars: { autoplay: 0, controls: 1 },
        events: {
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED) {
        window.location.href = NEXT_PAGE;
      }
    }
  </script>
</body>
</html>
