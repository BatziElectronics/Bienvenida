<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <title>Video dedicado</title>
  
</head>
<style>/* Código CSS para Video Responsive */
.video-container {
    /* Establece la posición relativa para que los elementos internos (iframe)
    se posicionen absolutamente respecto a este contenedor. */
    position: relative;
    
    /* El ancho del contenedor será el 100% de su padre. */
    width: 100%;
    
    /* Esta es la clave para la relación de aspecto 16:9.
    Se usa el padding inferior: (9 / 16) * 100 = 56.25% */
    padding-bottom: 56.25%;
    
    /* Oculta lo que esté fuera de estos límites. */
    overflow: hidden;
    
    /* El alto se establece en 0, dejando el padding-bottom como el "alto" efectivo. */
    height: 0;
}

/* Estilos aplicados al iframe real del video que se inyectará */
.video-container iframe {
    /* El iframe se superpone a todo el contenedor. */
    position: absolute;
    top: 0;
    left: 0;
    
    /* El video ocupa el 100% del alto y ancho del contenedor (dado por el padding). */
    width: 100%;
    height: 100%;
}
h1 {
text-align: center;
color: white;
}
p {
text-align: center;
color: white;
}
body{
background: blue;
}
</style>
<body>
  <h1>Hey, me alegra que estés aquí!!</h1> <br><br>
  <p>Por ello te quiero dedicar esta canción. </p> <br> <br>

  <!-- Botón para mostrar el video -->
  <a href="https://m.youtube.com/watch?v=PR369RYJbAg&pp=ygUZZWwgcHJvZmVzb3IgbWlyYW5kYSBsZXRyYQ%3D%3D" id="verVideo"</a>

  <!-- Aquí se insertará el video embebido -->
  <div class="video-container">
    <div id="player"></div>
  </div>
  
  <!-- API de YouTube -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const VIDEO_ID = "PR369RYJbAg"; // ID del video
    const NEXT_PAGE = "https://batzielectronics.github.io/Entrenamiento-Inteligente/"; // siguiente página

    let player;

    // Crea el reproductor cuando la API está lista
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '315',
        width: '560',
        videoId: VIDEO_ID,
        playerVars: { autoplay: 0, controls: 1 },
        events: { 'onStateChange': onPlayerStateChange }
      });
    }

    // Detecta cuando termina el video
    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED) {
        window.location.href = NEXT_PAGE; // redirige al terminar
      }
    }

    // Mostrar el video al pulsar el botón
    document.getElementById('verVideo').addEventListener('click', function(e) {
      e.preventDefault();
      document.getElementById('player').style.display = 'block';
      this.style.display = 'none'; // oculta el botón
      player.playVideo(); // inicia el video
    });
  </script>
</body>
</html>
